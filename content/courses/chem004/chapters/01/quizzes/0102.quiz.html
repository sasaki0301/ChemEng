<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Classification and Properties of Matter</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Classification and Properties of Matter - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

  const quizData = [

{q:"Which of the following is classified as a pure substance?",c:["Saltwater","Air","Distilled water","Concrete"],a:2,e:"Distilled water consists only of H₂O molecules and has a fixed composition."},

{q:"What is the primary difference between a pure substance and a mixture?",c:["Pure substances contain atoms while mixtures do not","Pure substances have a fixed composition","Mixtures contain only liquids","Mixtures cannot be separated"],a:1,e:"Pure substances have a definite and fixed composition, while mixtures may vary in composition."},

{q:"Which of the following is an element?",c:["Carbon dioxide","Copper","Water","Table salt"],a:1,e:"Copper (Cu) is an element because it consists of only one type of atom."},

{q:"Which of the following is a compound?",c:["Gold","Oxygen","Carbon dioxide","Helium"],a:2,e:"Carbon dioxide (CO₂) contains carbon and oxygen chemically combined in a fixed ratio."},

{q:"Which statement best describes a compound?",c:["Two or more substances physically mixed","A substance composed of one type of atom","Two or more elements chemically combined in fixed proportions","A material that can never be separated"],a:2,e:"Compounds are formed when elements chemically bond in fixed ratios."},

{q:"Air is classified as a:",c:["Element","Compound","Homogeneous mixture","Heterogeneous mixture"],a:2,e:"Air contains several gases uniformly mixed together."},

{q:"Which of the following is a heterogeneous mixture?",c:["Brass","Saltwater","Vinegar","Oil and water"],a:3,e:"Oil and water form separate visible phases and are not uniformly mixed."},

{q:"Which characteristic is true for homogeneous mixtures?",c:["The composition varies from one region to another","Components are evenly distributed throughout","The components are chemically bonded","The mixture contains only one substance"],a:1,e:"Homogeneous mixtures have a uniform composition throughout."},

{q:"Concrete is best classified as a:",c:["Element","Compound","Homogeneous mixture","Heterogeneous mixture"],a:3,e:"Concrete contains visibly different components such as cement, sand, and gravel."},

{q:"Which property can be observed without changing a substance into a different substance?",c:["Flammability","Corrosion tendency","Physical property","Chemical property"],a:2,e:"Physical properties can be observed without altering the chemical identity of a substance."},

{q:"Which of the following is a physical property?",c:["Rusting","Burning","Density","Reactivity with acid"],a:2,e:"Density can be measured without changing the substance chemically."},

{q:"Which of the following is a chemical property?",c:["Color","Melting point","Density","Ability to rust"],a:3,e:"Rusting involves a chemical reaction and therefore represents a chemical property."},

{q:"An engineer measures the density of a metal sample. This measurement is an example of:",c:["A chemical property","A chemical change","A physical property","A physical change"],a:2,e:"Density is a physical property because it can be measured without changing the substance."},

{q:"Which property is extensive?",c:["Density","Boiling point","Mass","Color"],a:2,e:"Mass depends on the amount of matter present, making it an extensive property."},

{q:"Which property is intensive?",c:["Volume","Mass","Length","Density"],a:3,e:"Density remains the same regardless of sample size."},

{q:"A 5 g sample and a 50 g sample of pure aluminum have the same density. This demonstrates that density is:",c:["Chemical","Extensive","Intensive","Variable"],a:2,e:"Density does not depend on the amount of material present."},

{q:"A material scientist is analyzing pure silicon used in computer chips. Silicon is classified as:",c:["Element","Compound","Homogeneous mixture","Heterogeneous mixture"],a:0,e:"Silicon consists of only one type of atom and is therefore an element."},

{q:"A water treatment facility removes sand from water using filtration. This process works because sand and water form a:",c:["Compound","Element","Homogeneous mixture","Heterogeneous mixture"],a:3,e:"Sand and water are physically mixed and remain visibly distinct."},

{q:"Why can the components of a mixture usually be separated by physical means?",c:["They are chemically bonded","They are physically combined","They contain only one type of atom","They are pure substances"],a:1,e:"Mixture components are physically combined and retain their individual properties."},

{q:"An engineer selects copper wiring because of its excellent electrical conductivity. Electrical conductivity is classified as a:",c:["Chemical property","Physical property","Chemical change","Extensive property only"],a:1,e:"Electrical conductivity can be measured without changing the composition of the material, making it a physical property."}

];

  let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
