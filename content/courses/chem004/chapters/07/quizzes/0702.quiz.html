<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Real-World Engineering Gas Calculations and Case Studies</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Real-World Engineering Gas Calculations and Case Studies - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>
const quizData = [

{q:"When designing a gas storage tank, which variable is most directly controlled by increasing the tank's size?",c:["Temperature of the gas","Volume available for the gas","Molar mass of the gas","Gas constant value"],a:1,e:"Increasing tank size increases the available volume, which can reduce pressure for a given amount of gas."},

{q:"Why do engineers calculate the minimum required volume for gas storage tanks?",c:["To maximize gas temperature","To maintain safe operating pressures","To reduce the molar mass of gases","To eliminate the need for monitoring systems"],a:1,e:"Proper tank sizing helps ensure pressures remain within safe operating limits."},

{q:"A factory expands production and installs additional pneumatic equipment. What gas-related concern must engineers evaluate first?",c:["The color of the compressed air lines","The compressed air demand of the system","The atmospheric humidity outdoors","The molecular structure of nitrogen"],a:1,e:"Engineers must determine whether the existing compressor system can meet increased air demand."},

{q:"Which equation is most commonly used to analyze gas storage and compressed-air systems?",c:["P₁V₁ = P₂V₂","PV = nRT","P₁/T₁ = P₂/T₂","V₁/T₁ = V₂/T₂"],a:1,e:"The Ideal Gas Law relates pressure, volume, temperature, and moles simultaneously."},

{q:"Why must hospitals accurately calculate oxygen storage requirements?",c:["To improve oxygen color and purity","To ensure an uninterrupted supply during operation","To reduce the molecular weight of oxygen","To eliminate pressure variations entirely"],a:1,e:"Accurate calculations ensure sufficient oxygen is available for patient care."},

{q:"A medical oxygen cylinder is exposed to unusually high temperatures. Which safety concern becomes most important?",c:["A decrease in gas density","A reduction in oxygen purity","An increase in cylinder pressure","A change in oxygen composition"],a:2,e:"Higher temperatures can increase pressure and create safety hazards."},

{q:"Why do engineers carefully control the amount of gas generated during airbag deployment?",c:["To improve fuel economy","To ensure proper inflation pressure and volume","To reduce tire wear","To increase engine performance"],a:1,e:"The correct gas quantity ensures the airbag inflates effectively without excessive pressure."},

{q:"What is the primary engineering objective of a data center cooling system?",c:["To increase internet bandwidth","To reduce airflow throughout the facility","To remove heat generated by equipment","To decrease server processing speed"],a:2,e:"Cooling systems remove heat to maintain reliable operating temperatures."},

{q:"Which problem is most likely to occur if a data center develops airflow dead zones?",c:["Higher oxygen concentration","Reduced network traffic","Localized overheating of equipment","Lower atmospheric pressure"],a:2,e:"Poor airflow can create hot spots that damage hardware."},

{q:"Why do engineers monitor airflow patterns in data centers?",c:["To increase gas density","To improve heat removal efficiency","To decrease electrical conductivity","To eliminate humidity completely"],a:1,e:"Airflow management is critical for effective cooling and energy efficiency."},

{q:"Which engineering challenge is commonly encountered in long-distance natural gas pipelines?",c:["Pressure loss during transport","Loss of molecular mass","Conversion of gas into solids","Changes in atomic structure"],a:0,e:"Pressure gradually decreases along pipelines due to friction and flow resistance."},

{q:"Why are compressor stations installed along natural gas pipelines?",c:["To change the chemical composition of the gas","To increase humidity levels","To restore pressure lost during transport","To cool the gas to freezing temperatures"],a:2,e:"Compressors maintain sufficient pressure for efficient transport."},

{q:"Which environmental condition is most carefully controlled in semiconductor clean rooms?",c:["Air pressure and contamination levels","Earth's magnetic field","Atmospheric oxygen percentage","Outdoor wind direction"],a:0,e:"Pressure and cleanliness are critical for semiconductor manufacturing."},

{q:"Why are clean rooms often maintained at positive pressure?",c:["To increase gas density","To prevent contaminants from entering","To reduce airflow rates","To decrease equipment temperatures"],a:1,e:"Positive pressure helps keep contaminants out of sensitive production areas."},

{q:"Which safety device is specifically designed to prevent dangerous pressure buildup in gas systems?",c:["Air filter","Flow meter","Pressure relief valve","Heat exchanger"],a:2,e:"Pressure relief valves protect equipment from overpressure conditions."},

{q:"What is the primary purpose of gas leak detection systems in industrial facilities?",c:["To improve compressor efficiency","To identify unsafe gas releases quickly","To increase operating pressure","To measure gas color"],a:1,e:"Leak detection systems help prevent accidents and environmental releases."},

{q:"An engineer obtains a numerical solution to a gas calculation. What should be done next?",c:["Accept the answer immediately","Verify whether the result is physically reasonable","Repeat the calculation using different units only","Ignore safety considerations"],a:1,e:"Engineers must evaluate whether results make practical and physical sense."},

{q:"Which factor is most important when evaluating the safety of a gas storage system?",c:["Container paint color","Maximum operating pressure","Age of the gas molecules","Shape of individual particles"],a:1,e:"Maximum operating pressure is a critical safety parameter."},

{q:"Why do engineers use case studies when analyzing gas systems?",c:["To memorize formulas without application","To understand how gas principles operate in real situations","To avoid performing calculations","To eliminate the need for safety assessments"],a:1,e:"Case studies connect theory to practical engineering decisions."},

{q:"Which statement best summarizes the role of gas calculations in engineering design?",c:["They are useful only in laboratory experiments","They help engineers design safe, efficient, and reliable systems","They replace all field measurements and testing","They are needed only when gases are stored at high pressure"],a:1,e:"Gas calculations support design, operation, optimization, and safety across many engineering applications."}

];
  
let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
