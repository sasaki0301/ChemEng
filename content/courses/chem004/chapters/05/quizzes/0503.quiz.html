<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Limiting Reactants and Percent Yield</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Limiting Reactants and Percent Yield - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>
const quizData = [

{q:"What is a limiting reactant?",c:["The reactant present in the largest amount","The reactant that determines the maximum amount of product formed","The reactant left over after the reaction","The product formed first"],a:1,e:"The limiting reactant is consumed first and limits the amount of product that can be produced."},

{q:"What is an excess reactant?",c:["The reactant completely consumed","The reactant that remains after the reaction is complete","The product produced in excess","The catalyst used in the reaction"],a:1,e:"An excess reactant is not completely consumed and remains after the reaction ends."},

{q:"Why does a chemical reaction stop?",c:["The temperature becomes constant","The limiting reactant is consumed","The excess reactant disappears","The products decompose"],a:1,e:"Once the limiting reactant is used up, the reaction can no longer continue."},

{q:"In the reaction N₂ + 3H₂ → 2NH₃, if 1 mol N₂ reacts with 2 mol H₂, which reactant is limiting?",c:["N₂","H₂","NH₃","Neither reactant"],a:1,e:"1 mol N₂ requires 3 mol H₂, but only 2 mol H₂ are available."},

{q:"In the reaction 2H₂ + O₂ → 2H₂O, if 6 mol H₂ reacts with 4 mol O₂, which reactant is limiting?",c:["H₂","O₂","H₂O","Neither reactant"],a:0,e:"6 mol H₂ requires only 3 mol O₂, so hydrogen is consumed first."},

{q:"What is theoretical yield?",c:["The amount of product actually obtained","The maximum amount of product predicted by stoichiometry","The amount of excess reactant remaining","The amount lost during reaction"],a:1,e:"Theoretical yield is the maximum possible product calculated from the limiting reactant."},

{q:"Theoretical yield should always be calculated from:",c:["The excess reactant","The catalyst","The limiting reactant","The product"],a:2,e:"The limiting reactant determines the maximum amount of product that can form."},

{q:"What is actual yield?",c:["The maximum predicted product","The amount of product actually obtained experimentally","The mass of excess reactant","The amount lost during purification"],a:1,e:"Actual yield is the amount of product collected from a real reaction."},

{q:"What does percent yield measure?",c:["Reaction speed","Reaction efficiency","Reaction temperature","Reaction pressure"],a:1,e:"Percent yield indicates how efficiently reactants were converted into product."},

{q:"Which formula is used to calculate percent yield?",c:["(Theoretical Yield ÷ Actual Yield) × 100","(Actual Yield ÷ Theoretical Yield) × 100","Actual Yield × Theoretical Yield","Theoretical Yield − Actual Yield"],a:1,e:"Percent Yield = (Actual Yield ÷ Theoretical Yield) × 100."},

{q:"If the actual yield is 72 g and the theoretical yield is 90 g, what is the percent yield?",c:["72%","80%","90%","125%"],a:1,e:"(72 ÷ 90) × 100 = 80%."},

{q:"If the actual yield is 45 g and the theoretical yield is 60 g, what is the percent yield?",c:["60%","70%","75%","80%"],a:2,e:"(45 ÷ 60) × 100 = 75%."},

{q:"A reaction has a theoretical yield of 120 g and an actual yield of 96 g. What is the percent yield?",c:["70%","75%","80%","85%"],a:2,e:"(96 ÷ 120) × 100 = 80%."},

{q:"Why are percent yields often less than 100%?",c:["Atoms disappear during reactions","Products are often lost or side reactions occur","Theoretical yield is always wrong","Reactants gain mass"],a:1,e:"Incomplete reactions, side reactions, and product losses reduce actual yield."},

{q:"Which of the following is NOT a common cause of low percent yield?",c:["Side reactions","Product loss during collection","Incomplete reactions","Creation of new atoms"],a:3,e:"Atoms are neither created nor destroyed in chemical reactions."},

{q:"In the reaction 2CO + O₂ → 2CO₂, if 5 mol CO reacts with 2 mol O₂, which reactant is limiting?",c:["CO","O₂","CO₂","Neither reactant"],a:1,e:"5 mol CO requires 2.5 mol O₂, but only 2 mol O₂ are available."},

{q:"In the reaction 2Mg + O₂ → 2MgO, if 8 mol Mg reacts with 5 mol O₂, which reactant is limiting?",c:["Mg","O₂","MgO","Neither reactant"],a:0,e:"8 mol Mg requires only 4 mol O₂, so Mg is consumed first."},

{q:"A chemical engineer calculates a theoretical yield of 500 kg NH₃, but the plant produces only 450 kg. What is the percent yield?",c:["85%","90%","95%","100%"],a:1,e:"(450 ÷ 500) × 100 = 90%."},

{q:"What does a percent yield of exactly 100% indicate?",c:["Actual yield is greater than theoretical yield","Actual yield equals theoretical yield","No reaction occurred","The limiting reactant was not used"],a:1,e:"A 100% yield means the actual yield matches the theoretical prediction."},

{q:"Why is determining the limiting reactant important in engineering processes?",c:["It identifies the catalyst","It determines the maximum possible product and resource requirements","It changes the balanced equation","It increases reaction speed"],a:1,e:"Engineers use limiting reactants to predict production capacity and optimize resource usage."}

];

  let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
