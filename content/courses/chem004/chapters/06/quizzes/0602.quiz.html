<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gas Laws: Boyle’s, Charles’, Combined Gas Law</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Gas Laws: Boyle’s, Charles’, Combined Gas Law - Quiz</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

  const quizData = [

{q:"Which gas law describes the inverse relationship between pressure and volume when temperature remains constant?",c:["Charles' Law","Gay-Lussac's Law","Boyle's Law","Ideal Gas Law"],a:2,e:"Boyle's Law states that pressure and volume are inversely proportional at constant temperature."},

{q:"According to Boyle's Law, what happens to the pressure of a gas if its volume is reduced to half while temperature remains constant?",c:["Pressure becomes one-fourth","Pressure remains unchanged","Pressure doubles","Pressure increases by 50%"],a:2,e:"Pressure and volume are inversely proportional, so halving the volume doubles the pressure."},

{q:"Which equation correctly represents Boyle's Law?",c:["P₁/T₁ = P₂/T₂","V₁/T₁ = V₂/T₂","P₁V₁ = P₂V₂","PV = nRT"],a:2,e:"Boyle's Law is represented by P₁V₁ = P₂V₂."},

{q:"Which gas law explains why a hot-air balloon expands as the air inside is heated?",c:["Boyle's Law","Charles' Law","Combined Gas Law","Dalton's Law"],a:1,e:"Charles' Law states that volume increases as temperature increases when pressure remains constant."},

{q:"Why must temperature be expressed in Kelvin when solving gas law problems?",c:["Kelvin values are always larger than Celsius values","Gas laws require an absolute temperature scale","Kelvin simplifies unit conversions","Pressure can only be measured in Kelvin"],a:1,e:"Gas law relationships are based on absolute temperature, which requires the Kelvin scale."},

{q:"Which equation represents Charles' Law?",c:["V₁/T₁ = V₂/T₂","P₁V₁ = P₂V₂","P₁/T₁ = P₂/T₂","PV = nRT"],a:0,e:"Charles' Law relates volume and temperature directly."},

{q:"A gas occupies 8.0 L at 300 K. If the temperature increases to 600 K at constant pressure, what is the new volume?",c:["4.0 L","8.0 L","12.0 L","16.0 L"],a:3,e:"Volume doubles when temperature doubles, so the volume becomes 16.0 L."},

{q:"Which gas law describes the direct relationship between pressure and temperature when volume remains constant?",c:["Boyle's Law","Charles' Law","Gay-Lussac's Law","Combined Gas Law"],a:2,e:"Gay-Lussac's Law relates pressure directly to temperature at constant volume."},

{q:"A sealed aerosol can is heated. Which gas law best explains the increase in pressure?",c:["Boyle's Law","Charles' Law","Gay-Lussac's Law","Avogadro's Law"],a:2,e:"When volume remains constant, increasing temperature increases pressure according to Gay-Lussac's Law."},

{q:"Which equation correctly represents Gay-Lussac's Law?",c:["P₁/T₁ = P₂/T₂","V₁/T₁ = V₂/T₂","P₁V₁ = P₂V₂","PV = nRT"],a:0,e:"Gay-Lussac's Law relates pressure and temperature directly."},

{q:"What is the primary purpose of the Combined Gas Law?",c:["To relate pressure and volume only","To relate pressure, volume, and temperature simultaneously","To calculate moles of gas","To determine gas density"],a:1,e:"The Combined Gas Law is used when pressure, volume, and temperature all change."},

{q:"Which equation represents the Combined Gas Law?",c:["PV = nRT","P₁V₁ = P₂V₂","(P₁V₁)/T₁ = (P₂V₂)/T₂","P₁/T₁ = P₂/T₂"],a:2,e:"The Combined Gas Law combines Boyle's, Charles', and Gay-Lussac's Laws."},

{q:"A gas occupies 12.0 L at 1.0 atm. If the pressure increases to 3.0 atm while temperature remains constant, what volume will the gas occupy?",c:["2.0 L","4.0 L","6.0 L","36.0 L"],a:1,e:"Using Boyle's Law: V₂ = (1.0 × 12.0) ÷ 3.0 = 4.0 L."},

{q:"A gas occupies 5.0 L at 25°C. If heated to 125°C at constant pressure, what happens to its volume?",c:["It decreases because particles move faster","It remains constant because pressure is unchanged","It increases because volume and temperature are directly related","It becomes independent of temperature"],a:2,e:"Charles' Law predicts an increase in volume as temperature increases."},

{q:"Which variable must remain constant for Boyle's Law to apply?",c:["Pressure","Volume","Temperature","Number of collisions"],a:2,e:"Boyle's Law assumes constant temperature and amount of gas."},

{q:"Which variable must remain constant for Charles' Law to apply?",c:["Pressure","Volume","Temperature","Moles"],a:0,e:"Charles' Law applies when pressure remains constant."},

{q:"Which variable must remain constant for Gay-Lussac's Law to apply?",c:["Pressure","Temperature","Volume","Density"],a:2,e:"Gay-Lussac's Law requires constant volume."},

{q:"A gas cylinder contains gas at 200 kPa and 300 K. If heated to 450 K at constant volume, what is the final pressure?",c:["100 kPa","200 kPa","300 kPa","450 kPa"],a:2,e:"P₂ = (200 × 450) ÷ 300 = 300 kPa."},

{q:"Why does a diver experience changes in the volume of air in their lungs as they descend underwater?",c:["Charles' Law","Boyle's Law","Gay-Lussac's Law","Ideal Gas Law"],a:1,e:"Increasing pressure underwater causes gas volume to decrease according to Boyle's Law."},

{q:"Which statement best summarizes the relationship among the gas laws studied in this lesson?",c:["Each law describes a different relationship among pressure, volume, and temperature under specific conditions","All gas laws describe exactly the same variables changing simultaneously","Gas laws apply only to laboratory experiments and not real systems","The laws are unrelated and cannot be combined mathematically"],a:0,e:"Each gas law focuses on specific variables while holding others constant, and together they form the foundation of gas behavior."}

];

  let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
