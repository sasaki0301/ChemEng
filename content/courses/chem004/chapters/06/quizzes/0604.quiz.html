<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chapter 6 Assessment: Gases and Their Behavior</title>

<style>
/* SAME STYLE AS TEMPLATE */
body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #e8f9f1, #f7faff);
  margin: 0;
  padding: 40px 20px;
  color: #222;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.quiz-container {
  background: #ffffff;
  border-radius: 18px;
  padding: 40px 50px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
  width: 95%;
  max-width: 850px;
  text-align: center;
}
h2 { color: #136f63; margin-bottom: 25px; }
.progress-wrapper { background:#e9f5ef; border-radius:8px; height:14px; width:100%; margin-bottom:25px; overflow:hidden;}
.progress-bar { height:100%; background:linear-gradient(to right,#136f63,#2b7de9); width:0%; transition:width 0.4s;}
.progress-text { text-align:right; font-size:0.95em; color:#174ea6; margin-bottom:10px; font-weight:600;}
.question { font-size:1.3em; font-weight:600; color:#174ea6; margin-bottom:20px;}
.choices { display:flex; flex-direction:column; gap:12px; margin-bottom:20px;}
.choice { background:#e8ecf8; border:none; border-radius:10px; padding:14px; cursor:pointer; text-align:left;}
.choice:hover { background:#d3dbf8; transform:translateY(-2px);}
.choice.correct {background: #2b7de9;color: #fff;}
.choice.incorrect {background: #e57373;color: #fff;}
.explanation { background:#eef3ff; border-radius:10px; padding:14px; text-align:left; margin-bottom:20px; display:none;}
.next-btn { background:#136f63; color:#fff; border:none; padding:12px 26px; border-radius:10px; cursor:pointer;}
.result { font-size:1.4em; font-weight:bold; color:#174ea6;}
.stars { font-size:2.5em; margin-top:10px;}
.quiz-nav { margin-top:25px; display:flex; justify-content:center; gap:10px;}
.quiz-btn { background:#e8ecf8; border:none; border-radius:8px; padding:10px 20px; cursor:pointer;}
.quiz-btn.primary { background:#136f63; color:#fff;}
@media (max-width: 600px) {
    .quiz-container { padding: 25px; }
    .question { font-size: 1.1em; }
    .stars { font-size: 2em; }
  }

.diagram-box {margin: 12px 0 20px; background: #f7fbff; border: 1px dashed #d8e9ff; padding: 10px; border-radius: 8px; }

svg {
  width: 100%;
  max-width: 600px;
  margin: auto;
  display: block;
}
</style>
</head>

<body>

<div class="quiz-container">

<h2>Chapter 6 Assessment: Gases and Their Behavior</h2>

<div class="progress-text" id="progressText"></div>
<div class="progress-wrapper">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="quizBox"></div>

<button id="nextBtn" class="next-btn" style="display:none;">Next</button>

</div>

<script>

  const quizData = [

{q:"Which assumption of the Kinetic Molecular Theory states that gas particles move continuously and unpredictably?",c:["Particles possess fixed positions within the container","Particles move in continuous random motion","Particles remain stationary between collisions","Particles travel only in circular paths"],a:1,e:"Kinetic Molecular Theory assumes gas particles move continuously and randomly."},

{q:"What is the primary cause of gas pressure inside a closed container?",c:["Chemical reactions between gas molecules","Collisions of particles with container walls","Attractive forces among gas particles","Changes in particle mass over time"],a:1,e:"Pressure results from collisions of gas particles against container walls."},

{q:"Which property best explains why gases can be compressed much more than liquids?",c:["Gas particles possess smaller masses","Gas particles are separated by large empty spaces","Gas particles move more slowly","Gas particles have stronger attractions"],a:1,e:"Large spaces between gas particles allow compression."},

{q:"What is diffusion?",c:["The movement of gas through a tiny opening","The spontaneous mixing of gas particles","The compression of gas under pressure","The conversion of gas into liquid"],a:1,e:"Diffusion is the mixing of particles caused by random motion."},

{q:"What is effusion?",c:["The mixing of gases throughout a container","The expansion of a gas due to heating","The escape of gas through a small opening","The increase in gas density"],a:2,e:"Effusion refers to gas particles passing through a tiny opening."},

{q:"According to Kinetic Molecular Theory, increasing temperature causes gas particles to:",c:["Decrease in mass","Move more slowly","Gain average kinetic energy","Become larger"],a:2,e:"Temperature is directly related to average kinetic energy."},

{q:"Which gas law describes the relationship between pressure and volume at constant temperature?",c:["Charles' Law","Boyle's Law","Gay-Lussac's Law","Ideal Gas Law"],a:1,e:"Boyle's Law states that pressure and volume are inversely proportional."},

{q:"Which equation represents Boyle's Law?",c:["V₁/T₁ = V₂/T₂","P₁/T₁ = P₂/T₂","P₁V₁ = P₂V₂","PV = nRT"],a:2,e:"Boyle's Law is expressed as P₁V₁ = P₂V₂."},

{q:"A gas occupies 12.0 L at 1.5 atm. What volume will it occupy at 3.0 atm if temperature remains constant?",c:["3.0 L","6.0 L","12.0 L","24.0 L"],a:1,e:"V₂=(1.5×12.0)/3.0=6.0 L."},

{q:"Which gas law relates volume and temperature when pressure remains constant?",c:["Boyle's Law","Charles' Law","Combined Gas Law","Dalton's Law"],a:1,e:"Charles' Law relates volume directly to temperature."},

{q:"Which equation represents Charles' Law?",c:["P₁V₁ = P₂V₂","V₁/T₁ = V₂/T₂","P₁/T₁ = P₂/T₂","PV = nRT"],a:1,e:"Charles' Law is V₁/T₁ = V₂/T₂."},

{q:"A gas occupies 5.0 L at 300 K. What volume will it occupy at 450 K if pressure remains constant?",c:["3.3 L","5.0 L","7.5 L","10.0 L"],a:2,e:"V₂=(5.0×450)/300=7.5 L."},

{q:"Which gas law explains why pressure increases inside a heated aerosol can?",c:["Boyle's Law","Charles' Law","Gay-Lussac's Law","Avogadro's Law"],a:2,e:"Gay-Lussac's Law relates pressure directly to temperature."},

{q:"Which equation represents Gay-Lussac's Law?",c:["P₁/T₁ = P₂/T₂","V₁/T₁ = V₂/T₂","P₁V₁ = P₂V₂","PV = nRT"],a:0,e:"Gay-Lussac's Law relates pressure and temperature."},

{q:"A gas is at 100 kPa and 300 K. If heated to 450 K at constant volume, what is the new pressure?",c:["150 kPa","100 kPa","200 kPa","225 kPa"],a:0,e:"P₂=(100×450)/300=150 kPa."},

{q:"When should the Combined Gas Law be used?",c:["When only pressure changes","When only volume changes","When pressure, volume, and temperature change","When calculating gas density"],a:2,e:"The Combined Gas Law is used when multiple gas variables change."},

{q:"Which equation represents the Combined Gas Law?",c:["PV=nRT","(P₁V₁)/T₁=(P₂V₂)/T₂","P₁V₁=P₂V₂","P₁/T₁=P₂/T₂"],a:1,e:"This equation combines Boyle's, Charles', and Gay-Lussac's Laws."},

{q:"What is the value of the gas constant R when pressure is expressed in atmospheres?",c:["0.0821 L·atm/mol·K","8.314 L·atm/mol·K","22.4 L·atm/mol·K","62.4 L·atm/mol·K"],a:0,e:"The commonly used value is 0.0821 L·atm/mol·K."},

{q:"Which equation represents the Ideal Gas Law?",c:["P₁V₁=P₂V₂","PV=nRT","V₁/T₁=V₂/T₂","P₁/T₁=P₂/T₂"],a:1,e:"The Ideal Gas Law combines pressure, volume, temperature, and moles."},

{q:"What does the variable n represent in PV=nRT?",c:["Pressure","Volume","Number of moles","Gas density"],a:2,e:"n represents the amount of gas in moles."},

{q:"Convert 27°C to Kelvin.",c:["246.15 K","273.15 K","300.15 K","327.15 K"],a:2,e:"27 + 273.15 = 300.15 K."},

{q:"At STP, one mole of an ideal gas occupies approximately:",c:["11.2 L","22.4 L","24.5 L","44.8 L"],a:1,e:"One mole occupies 22.4 L at STP."},

{q:"How many liters will 2.5 mol of an ideal gas occupy at STP?",c:["22.4 L","44.8 L","56.0 L","84.0 L"],a:2,e:"2.5 × 22.4 = 56.0 L."},

{q:"A gas occupies 24.6 L at 1 atm and 300 K. How many moles are present?",c:["0.50 mol","1.00 mol","1.50 mol","2.00 mol"],a:1,e:"n = PV/RT ≈ 1.00 mol."},

{q:"A sample contains 2.0 mol gas at 300 K in a 49.2 L container. What is the pressure?",c:["0.50 atm","1.00 atm","2.00 atm","4.00 atm"],a:1,e:"P=nRT/V≈1.00 atm."},

{q:"A gas occupies 10.0 L at 2.0 atm and contains 1.0 mol. What is its temperature?",c:["122 K","244 K","366 K","488 K"],a:1,e:"T=PV/nR=(2.0×10.0)/(1×0.0821)=244 K."},

{q:"Which rearranged form of the Ideal Gas Law is used to determine the number of moles?",c:["n=PV/RT","n=RT/PV","n=P/RT","n=VT/PR"],a:0,e:"Moles are calculated using n = PV/RT."},

{q:"What is Standard Temperature and Pressure (STP)?",c:["1 atm and 273.15 K","1 atm and 298 K","100 kPa and 273 K","760 mmHg and 298 K"],a:0,e:"STP is defined as 1 atm and 273.15 K."},

{q:"Which equation is used to calculate gas density?",c:["d=PM/RT","d=RT/PM","d=PV/nRT","d=nRT/PV"],a:0,e:"Gas density may be calculated using d = PM/RT."},

{q:"The density of a gas depends directly on which two variables according to d=PM/RT?",c:["Pressure and molar mass","Temperature and molar mass","Pressure and temperature","Volume and pressure"],a:0,e:"Density is directly proportional to pressure and molar mass."},

{q:"A gas has a molar mass of 44 g/mol at 1 atm and 273 K. Which gas is most likely represented?",c:["H₂","N₂","CO₂","He"],a:2,e:"Carbon dioxide has a molar mass of approximately 44 g/mol."},

{q:"Why must gas cylinders be protected from excessive heat?",c:["Heat decreases particle motion","Heat increases gas pressure","Heat removes gas particles","Heat lowers molecular collisions"],a:1,e:"Increasing temperature raises pressure according to Gay-Lussac's Law."},

{q:"A diver descends deeper underwater. Which gas law best explains the reduction in air volume inside equipment?",c:["Charles' Law","Gay-Lussac's Law","Boyle's Law","Ideal Gas Law"],a:2,e:"Higher pressure causes volume to decrease according to Boyle's Law."},

{q:"A weather balloon expands as it rises through the atmosphere. Which gas law most directly explains this behavior?",c:["Boyle's Law","Charles' Law","Gay-Lussac's Law","Law of Conservation of Mass"],a:0,e:"As atmospheric pressure decreases, the gas expands."},

{q:"Which statement best summarizes the usefulness of gas laws in engineering?",c:["They explain only laboratory experiments","They predict relationships among gas variables in practical systems","They replace the need for measurements","They apply only at STP"],a:1,e:"Engineers use gas laws to design, analyze, and operate systems involving gases."}

];

  let current = 0, score = 0, selected = null, showingExplanation = false;
const quizBox = document.getElementById("quizBox");
const nextBtn = document.getElementById("nextBtn");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function showQuestion() {
  const q = quizData[current];
  updateProgress();
  quizBox.innerHTML = `
    <div class='question'>${q.q}</div>
	${q.svg || ""}
    <div class='choices'></div>
    <div class='explanation' id='explanationBox'></div>
  `;
  const choicesContainer = quizBox.querySelector(".choices");
  q.c.forEach((choice, i) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = choice;
    btn.addEventListener("click", () => selectChoice(i));
    choicesContainer.appendChild(btn);
  });
  nextBtn.style.display = "none";
  selected = null;
  showingExplanation = false;
}

function selectChoice(i) {
  if (showingExplanation) return;

  const q = quizData[current];
  const buttons = document.querySelectorAll(".choice");
  const expBox = document.getElementById("explanationBox");
  const correct = i === q.a;

  if (correct) score++;

  buttons.forEach((btn, idx) => {
    btn.disabled = true;

    if (idx === q.a) {
      btn.classList.add("correct");
    }

    if (idx === i && idx !== q.a) {
      btn.classList.add("incorrect");
    }
  });

  expBox.innerHTML = `<strong>${correct ? "✅ Correct!" : "❌ Incorrect."}</strong><br>${q.e}`;
  expBox.style.display = "block";
  nextBtn.style.display = "inline-block";
  showingExplanation = true;
}

nextBtn.addEventListener("click", () => {
  current++;
  if (current < quizData.length) showQuestion();
  else showResult();
});

function updateProgress() {
  const percent = (current / quizData.length) * 100;
  progressBar.style.width = percent + "%";
  progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
}

function getStarRating(percent) {
  if (percent === 100) return "⭐️⭐️⭐️";
  else if (percent >= 90) return "⭐️⭐️☆";
  else if (percent >= 80) return "⭐️☆☆";
  else return "☆☆☆";
}

let resultSent = false;

function showResult() {
  progressBar.style.width = "100%";
  progressText.textContent = "Quiz Completed";

  const percent = Math.round((score / quizData.length) * 100);
  const passed = percent >= 80;

  quizBox.innerHTML = `
    <div class='stars'>${getStarRating(percent)}</div>
    <div class='result'>You scored ${score}/${quizData.length} (${percent}%)</div>
    <p id="saveStatus" style="color:#174ea6;font-weight:600;margin-top:10px;">Saving progress...</p>
    <div class='quiz-nav'>
      <button class='quiz-btn' id='backBtn' disabled>⬅ Back</button>
      <button class='quiz-btn' id='retryBtn' disabled>🔁 Retry</button>
      <button class='quiz-btn primary' id='nextLessonBtn' disabled>➡ Next Lesson</button>
    </div>
  `;

  nextBtn.style.display = "none";

  if (!resultSent) {
    resultSent = true;
    window.parent.postMessage({ type: "quizResult", score: percent, passed }, "*");
  }

  setTimeout(() => {
    const status = document.getElementById("saveStatus");
    const backBtn = document.getElementById("backBtn");
    const retryBtn = document.getElementById("retryBtn");
    const nextLessonBtn = document.getElementById("nextLessonBtn");

    if (status) status.textContent = passed
      ? "Progress sent. You may proceed after it is saved."
      : "Attempt recorded. Retake the quiz to unlock the next lesson.";

    if (backBtn) backBtn.disabled = false;
    if (retryBtn) retryBtn.disabled = false;
    if (nextLessonBtn) nextLessonBtn.disabled = !passed;

    if (retryBtn) retryBtn.addEventListener("click", retryQuiz);
    if (backBtn) backBtn.addEventListener("click", () =>
      window.parent.postMessage({ type: "quizBack" }, "*")
    );
    if (nextLessonBtn) nextLessonBtn.addEventListener("click", () => {
      if (passed) window.parent.postMessage({ type: "quizNextLesson" }, "*");
    });
  }, 1200);
}

function retryQuiz() {
  resultSent = false;
  current = 0;
  score = 0;
  showQuestion();
}

showQuestion();
</script>
</body>
</html>
